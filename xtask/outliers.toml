# §6.4 modern-outliers curated list (#407). Committed input — data/ is
# gitignored output. Slugs are ours (not author free text); URLs must be
# direct zip links. Hosts that refuse range reads stay listed: the ledger
# and stats-report record the refusal ("where hosting permits").
#
# Live-probe status (2026-08-17 smoke): the modern size-tail anchors
# (Blade of Agony, Total Chaos, Golden Souls 2, Simon's Destiny) all live
# on hosts that refuse non-browser access — ModDB answers 403 to direct
# links, boa.realm667.com answers 500 to file paths. They stay listed so
# the refusal is ledgered and the report states the tail truncation
# instead of hiding it. The two analyzed entries below prove the
# machinery end-to-end (S3 asset; redirecting tokened static host) but do
# NOT extend the size tail — a future curation pass adds anchors if
# cooperative hosting appears. Candidates checked and rejected:
# Eviternity II (in-corpus: idgames levels/doom2/Ports/megawads/
# eviternityii.zip), Hands of Necromancy (no hosted zip asset exists),
# dsdarchive.com (406 to non-browser requests), itch.io (tokened,
# expiring), GitHub codeload archives (dynamic — no Content-Length, no
# ranges).
#
# `skip = true` (#442) marks a documented-hostile host: harvest-outliers
# records the entry (status skipped_known_dead, a fixed-string ledger
# line) without re-probing it — the refusal evidence lives in `note`.
# Remove the marker to re-probe an entry, e.g. if hosting changes.
