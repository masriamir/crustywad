[package]
name = "crustywad"
version = "0.7.1"
description.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

autobenches = false

[lib]
bench = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.dist]
dist = false

[features]
default = []
mmap = ["dep:memmap2"]
freedoom-tests = []
hexen-tests = []
doom64-tests = []
sweep-tests = []
# Internal, testing-only: compiles the mdBook guide's Rust samples as crate
# doctests (see src/guide_doctests.rs). Off by default because the harness
# `include_str!`s repo-level `docs/` files that are not in the published crate;
# CI enables it via `--all-features`. Not a user-facing capability.
guide-doctests = []
write = []
nodebuild = ["write"]
doom64-gfx = ["dep:png"]
# Decode the zlib-compressed ZDoom extended node dialects (ZNOD/ZGLN/ZGL2/ZGL3,
# ADR-0025 §5, #327). Pulls the pure-Rust `miniz_oxide` inflater; off by default
# so the core build stays decompressor-free.
extended-nodes-zlib = ["dep:miniz_oxide"]

[dependencies]
binrw.workspace = true
memmap2 = { version = "0.9.5", optional = true }
miniz_oxide = { version = "0.8", optional = true }
png = { version = "0.18.1", optional = true, default-features = false }
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Used by the `extended_nodes` integration test to build zlib-compressed `Z*`
# fixtures for the `extended-nodes-zlib` decode-path tests. Always present (dev
# builds only); the test bodies that use it are `#[cfg(feature = ...)]`-gated.
miniz_oxide = "0.8"
proptest.workspace = true
tempfile.workspace = true

[[example]]
name = "write_wad"
required-features = ["write"]

[[bench]]
name = "read_ops"
harness = false

[[bench]]
name = "write_ops"
harness = false
required-features = ["write"]

[[bench]]
name = "build_ops"
harness = false
required-features = ["nodebuild"]

[lints]
workspace = true
