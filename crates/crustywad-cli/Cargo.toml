[package]
name = "crustywad-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "cwad"
path = "src/main.rs"

[features]
default = []
mmap = ["crustywad/mmap"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
# version must match crustywad's own version (crates are versioned independently,
# per ADR-0011 §3) — cargo-deny enforces wildcards = "deny"
# write feature required for WadBuilder
crustywad = { path = "../crustywad", version = "0.1.0", features = ["write"] }

[build-dependencies]
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
