[package]
name = "crustywad-cli"
version = "0.1.4"
description.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "cwad"
path = "src/main.rs"

[features]
default = []
mmap = ["crustywad/mmap"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
# version is a caret requirement; update only when crustywad's version moves
# outside the allowed range (e.g. 0.1.z -> 0.2.0), per ADR-0011 §3 (crates are
# versioned independently) — cargo-deny enforces wildcards = "deny"
# write feature required for WadBuilder
crustywad = { path = "../crustywad", version = "0.3.1", features = ["write"] }

[build-dependencies]
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
