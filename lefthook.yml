pre-push:
  commands:
    branch-name:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        pattern='^(main|feature/[0-9]+(-[a-z0-9_-]*)?|bugfix/[0-9]+(-[a-z0-9_-]*)?|hotfix/[0-9]+(-[a-z0-9_-]*)?)$'
        if ! echo "$branch" | grep -qE "$pattern"; then
          echo "Branch '$branch' does not follow naming conventions."
          echo "Use: feature/###, bugfix/###, hotfix/###, or main"
          exit 1
        fi

pre-commit:
  parallel: true
  commands:
    fmt:
      run: cargo fmt --all --check
    clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

commit-msg:
  commands:
    conventional-commits:
      run: |
        python3 - <<'PY' "{1}"
import pathlib
import re
import sys
message = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()[0]
pattern = re.compile(r'^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+')
if not pattern.match(message):
    print('commit message must follow Conventional Commits, e.g. feat(parser): add wad reader')
    sys.exit(1)
PY
