name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # weekly, Sunday 02:00 UTC
  pull_request:
    paths:
      - 'fuzz/**'
      # The workflow file itself: a PR editing only the lint/fuzz pipeline must
      # validate here in the PR, not first fail on the weekly schedule.
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

jobs:
  # The fuzz workspace is not covered by the main CI pipeline's fmt/clippy
  # gates (it is a separate cargo workspace), so lint drift only ever surfaced
  # when someone ran clippy there by hand (#372). This job closes that gap:
  # it runs on the weekly schedule, on dispatch, and on any PR touching fuzz/.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch pin
        with:
          # fuzz/rust-toolchain.toml pins the directory to nightly (cargo-fuzz
          # requires it), so rustup overrides any other installed toolchain the
          # moment a cargo command runs under fuzz/ — install nightly WITH the
          # lint components or the job dies on "cargo-fmt is not installed".
          toolchain: nightly
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: fuzz
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: fuzz

  # The root security-deny job audits only the root workspace's graph, so
  # fuzz's dependencies (libfuzzer-sys, ...) escaped every advisory, license,
  # ban, and source check (#428). This job closes that gap on the xtask
  # pattern (ADR-0030 §1): cargo-deny reads its policy from the workspace
  # being checked, so fuzz/deny.toml carries the root policy plus the scoped
  # departures the fuzz graph needs. The weekly
  # schedule doubles as the advisory sweep — a new advisory in fuzz's tree
  # would otherwise surface only on the next fuzz/-touching PR.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch pin
        with:
          # fuzz/rust-toolchain.toml pins the directory to nightly, so any
          # cargo invocation under fuzz/ resolves to it — install nightly
          # explicitly rather than relying on rustup's auto-install.
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@bd62ac5c7f48306b3ae8d936b8868709cab7d6c3 # cargo-deny
      - run: cargo deny check
        working-directory: fuzz

  fuzz:
    # Fuzzing stays schedule/dispatch-only: a fuzz/-touching PR triggers the
    # lint job above, not 20+ minutes of libFuzzer runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch pin
        with:
          toolchain: nightly # cargo-fuzz requires nightly; set explicitly so the pinned SHA can't swap the channel
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Fuzz fuzz_wad_strict
        run: cargo fuzz run fuzz_wad_strict -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_wad_lenient
        run: cargo fuzz run fuzz_wad_lenient -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_parse_records_thing
        run: cargo fuzz run fuzz_parse_records_thing -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_assemble_map
        run: cargo fuzz run fuzz_assemble_map -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_extended_nodes
        run: cargo fuzz run fuzz_extended_nodes -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_deepbsp
        run: cargo fuzz run fuzz_deepbsp -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_gl_nodes
        run: cargo fuzz run fuzz_gl_nodes -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_parse_udmf
        run: cargo fuzz run fuzz_parse_udmf -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_assemble_udmf
        run: cargo fuzz run fuzz_assemble_udmf -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_doom64_map
        run: cargo fuzz run fuzz_doom64_map -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_write_doom_map
        run: cargo fuzz run fuzz_write_doom_map -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_parse_reject_blockmap
        run: cargo fuzz run fuzz_parse_reject_blockmap -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_build_lumps
        run: cargo fuzz run fuzz_build_lumps -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_build_nodes
        run: cargo fuzz run fuzz_build_nodes -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_build_gl_nodes
        run: cargo fuzz run fuzz_build_gl_nodes -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_sections
        run: cargo fuzz run fuzz_sections -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_gfx
        run: cargo fuzz run fuzz_gfx -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_texturex
        run: cargo fuzz run fuzz_texturex -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_doom64_png
        run: cargo fuzz run fuzz_doom64_png -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_audio_sfx
        run: cargo fuzz run fuzz_audio_sfx -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_audio_music
        run: cargo fuzz run fuzz_audio_music -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_audio_scripts
        run: cargo fuzz run fuzz_audio_scripts -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_strife_dialogue
        run: cargo fuzz run fuzz_strife_dialogue -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_archive
        run: cargo fuzz run fuzz_archive -- -max_total_time=60
        working-directory: fuzz
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
