name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # weekly, Sunday 02:00 UTC

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Fuzz fuzz_wad_strict
        run: cargo fuzz run fuzz_wad_strict -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_wad_lenient
        run: cargo fuzz run fuzz_wad_lenient -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz fuzz_parse_records_thing
        run: cargo fuzz run fuzz_parse_records_thing -- -max_total_time=60
        working-directory: fuzz
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
