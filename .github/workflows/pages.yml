name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.3 --locked
      - name: Install mdbook-mermaid
        # 0.17.0 declares mdbook-preprocessor = "0.5.0"; produces a non-fatal version
        # warning against mdBook 0.5.3 but builds and renders correctly.
        # Bump this pin once a release declares 0.5.3 compatibility.
        run: cargo install mdbook-mermaid --version 0.17.0 --locked
      - name: Generate mdbook-mermaid assets
        run: mdbook-mermaid install docs/guide
      - name: Build guide
        run: mdbook build docs/guide
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
