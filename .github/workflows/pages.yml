name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mdBook and mdbook-mermaid
        # Versions are pinned in tools/Cargo.toml and kept current by Dependabot.
        run: |
          mdbook_ver=$(python3 -c "
          import tomllib
          deps = tomllib.load(open('tools/Cargo.toml', 'rb'))['dependencies']
          print(deps['mdbook'])
          ")
          mermaid_ver=$(python3 -c "
          import tomllib
          deps = tomllib.load(open('tools/Cargo.toml', 'rb'))['dependencies']
          print(deps['mdbook-mermaid'])
          ")
          cargo install mdbook --version "$mdbook_ver" --locked
          cargo install mdbook-mermaid --version "$mermaid_ver" --locked
      - name: Generate mdbook-mermaid assets
        run: mdbook-mermaid install docs/guide
      - name: Build guide
        run: mdbook build docs/guide
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
