name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize guide and bench deployments so both can write to gh-pages safely.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install mdBook and mdbook-mermaid
        # Versions are pinned in tools/Cargo.toml and kept current by Dependabot.
        run: |
          mdbook_ver=$(python3 -c "import tomllib; v=tomllib.load(open('tools/Cargo.toml','rb'))['dependencies']['mdbook']; print(v if isinstance(v,str) else v['version'])")
          mermaid_ver=$(python3 -c "import tomllib; v=tomllib.load(open('tools/Cargo.toml','rb'))['dependencies']['mdbook-mermaid']; print(v if isinstance(v,str) else v['version'])")
          cargo install mdbook --version "$mdbook_ver" --locked
          cargo install mdbook-mermaid --version "$mermaid_ver" --locked
      - name: Generate mdbook-mermaid assets
        run: mdbook-mermaid install docs/guide
      - name: Build guide
        run: mdbook build docs/guide
      - name: Deploy guide to gh-pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          folder: target/book
          branch: gh-pages
          clean: true
          # Preserve benchmark data written by bench.yml — never delete dev/bench/.
          clean-exclude: |
            dev/
