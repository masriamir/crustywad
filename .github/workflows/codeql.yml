name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Run a full scan on a weekly schedule so new queries are applied even when
  # the source has not changed.
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [rust]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      # Provide a stable Rust toolchain matching the project MSRV so the
      # compiler artefacts produced for CodeQL are consistent.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Build the full workspace so every crate and feature combination is
      # compiled and thus analysed by CodeQL.
      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
