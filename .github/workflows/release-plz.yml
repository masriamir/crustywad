name: release-plz

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishing is intentionally disabled until crates.io credentials and release policy are ready.
  # To enable publishing later, add a publish job, set `publish = true` in `release-plz.toml`,
  # and provide `CARGO_REGISTRY_TOKEN`.
