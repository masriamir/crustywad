name: release-plz

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Opens/updates the release PR (version bumps + changelog). Never publishes.
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes any crate whose Cargo.toml version is not yet on crates.io (library
  # before CLI, ordering handled by release-plz), then creates git tags and GitHub
  # releases. Authenticates to crates.io via Trusted Publishing (OIDC) — no
  # long-lived CARGO_REGISTRY_TOKEN secret is stored.
  #
  # Prerequisite: both crates must already exist on crates.io and the repository
  # must be linked as a Trusted Publisher (workflow `release-plz.yml`). The very
  # first v0.1.0 publish is bootstrapped manually; see issue #181.
  release:
    runs-on: ubuntu-latest
    # Publish only on pushes to `main` (never on manual workflow_dispatch), and
    # only after release-pr has run. Matches ADR-0011.
    needs: release-pr
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
