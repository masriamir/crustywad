version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/tools"
    schedule:
      interval: weekly
  # fuzz/ is its own cargo workspace (excluded from the root workspace), so
  # neither "/" nor "/tools" reaches its Cargo.toml — without this stanza its
  # deps (libfuzzer-sys, ...) are never scanned.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
  # xtask/ is its own cargo workspace (excluded from the root workspace), so
  # neither "/" nor "/tools" reaches its Cargo.toml — without this stanza its
  # deps (clap, ...) are never scanned.
  - package-ecosystem: cargo
    directory: "/xtask"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # One PR per round for ALL actions updates: lockstep actions (the
    # codeql-action init/analyze pair) fail CI when bumped in separate PRs —
    # each PR alone runs a mismatched pair ("Loaded a configuration file for
    # version X, but running version Y").
    groups:
      github-actions:
        patterns:
          - "*"
