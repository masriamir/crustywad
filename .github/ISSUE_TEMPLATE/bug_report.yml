name: Bug report
description: Report a reproducible defect in crustywad
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include WAD details, commands, and logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: rustc and crate version
