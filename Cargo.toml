[workspace]
members = ["crates/crustywad", "crates/crustywad-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/masriamir/crustywad"
homepage = "https://github.com/masriamir/crustywad"
readme = "README.md"
keywords = ["doom", "wad", "parser"]
categories = ["parser-implementations", "game-development"]

[workspace.dependencies]
anyhow = "1.0.100"
binrw = "0.15.1"
clap = { version = "4.5.39", features = ["derive"] }
proptest = "1.6.0"
thiserror = "2.0.17"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
